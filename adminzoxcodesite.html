<style>
:root{--bg:#0f0f0f;--s1:#1a1a1a;--s2:#242424;--bd:#333;--tx:#fff;--t2:#c0c0c0;--t3:#808080;--ac:#0066ff}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.top{display:flex;align-items:center;gap:.9rem;padding:.9rem 1.5rem;background:linear-gradient(135deg,#050507,#0a1a45);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.top img{width:42px;height:42px;border-radius:10px}.top b{flex:1;font-size:1.05rem}.top small{display:block;font-weight:400;color:var(--t2);font-size:.75rem}
.btn{border:1px solid var(--bd);background:var(--s2);color:var(--tx);padding:.55rem .9rem;border-radius:9px;cursor:pointer;font:inherit;font-size:.85rem;transition:.2s}.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.p{background:linear-gradient(135deg,#0066ff,#0040ff);border:0;color:#fff;font-weight:700}.btn.p:hover{color:#fff;box-shadow:0 6px 18px rgba(0,102,255,.4)}
.wrap{max-width:1050px;margin:0 auto;padding:1.4rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:1rem}.stat small{color:var(--t3);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}.stat h3{font-size:1.5rem;margin-top:.3rem}.stat span{font-size:.78rem;color:var(--t2)}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}.tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1}
.tab{padding:.5rem .9rem;border-radius:20px;border:1px solid var(--bd);background:none;color:var(--t2);cursor:pointer;font:inherit;font-size:.83rem;transition:.2s}.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}.tab i{font-style:normal;opacity:.7;margin-left:.3rem}
input.s,.lg input{padding:.6rem .85rem;border-radius:10px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);font:inherit;font-size:.88rem;min-width:230px}input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,102,255,.2)}
.o{background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin-bottom:.7rem;overflow:hidden;transition:.2s}.o:hover{border-color:#444}
.oh{display:flex;align-items:center;gap:1rem;padding:.95rem 1.1rem;cursor:pointer;flex-wrap:wrap}.oh .id{font-weight:700;color:var(--ac);min-width:105px}.oh .c{flex:1;min-width:150px}.oh .c small{display:block;color:var(--t3);font-size:.78rem}.oh .v{font-weight:700}
.pill{padding:.25rem .7rem;border-radius:20px;font-size:.74rem;font-weight:700;border:1px solid}
.od{display:none;padding:0 1.1rem 1.1rem;border-top:1px solid var(--bd)}.o.on .od{display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem;margin:1rem 0}.g div{background:var(--s2);border-radius:10px;padding:.7rem .85rem}.g small{display:block;color:var(--t3);font-size:.7rem;text-transform:uppercase;margin-bottom:.15rem}.g span{font-size:.9rem;word-break:break-word}
.it{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px dashed var(--bd);font-size:.88rem}
.ac{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.ac .ok{border-color:#22c55e;color:#22c55e}.ac .no{border-color:#e5484d;color:#e5484d}
.em{text-align:center;padding:3rem 1rem;color:var(--t3)}
.nt{background:rgba(255,170,0,.1);border:1px solid rgba(255,170,0,.4);border-radius:12px;padding:.8rem 1rem;font-size:.84rem;margin-bottom:1rem}
.lg{max-width:380px;margin:12vh auto;padding:2rem;background:var(--s1);border:1px solid var(--bd);border-radius:18px;text-align:center}.lg img{width:90px;border-radius:20px;margin-bottom:1rem}.lg input{width:100%;margin-top:.7rem;min-width:0}.lg .btn{width:100%;margin-top:1rem;padding:.8rem}.lg p{color:#e5484d;font-size:.84rem;margin-top:.7rem;min-height:1em}
.btn.on{border-color:var(--ac);color:var(--ac)}.btn.no{border-color:#e5484d;color:#e5484d}
.pf{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:1.2rem;margin-bottom:1rem}.pf h3{margin-bottom:.4rem}
.pf label{display:block;font-size:.78rem;color:var(--t2);margin:.9rem 0 .35rem}
.pf input[type=text],.pf textarea{width:100%;padding:.65rem .85rem;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:inherit;font-size:.88rem}
.pf textarea{min-height:90px;resize:vertical;font-family:monospace}.pf input[type=file]{color:var(--t2);font-size:.85rem}
.pv{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:.7rem}.pv img{width:140px;height:140px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:600;border-radius:10px;padding:.6rem 1.05rem;line-height:1.2;user-select:none;transition:transform .15s,border-color .2s,color .2s,background .2s,box-shadow .2s}
.btn:hover{background:#2e2e2e}.btn:active{transform:scale(.97)}.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn.p{padding:.8rem 1.4rem}.btn.p:hover{background:linear-gradient(135deg,#1a75ff,#0a4dff);transform:translateY(-1px)}
.btn.no:hover{background:rgba(229,72,77,.12);border-color:#e5484d;color:#ff6b70}.ac .ok:hover{background:rgba(34,197,94,.12);color:#4ade80}
.btn:disabled{opacity:.55;cursor:not-allowed}
input[type=file]::file-selector-button{border:1px solid var(--bd);background:var(--s2);color:var(--tx);padding:.5rem .9rem;border-radius:8px;margin-right:.7rem;cursor:pointer;font:inherit;font-size:.85rem}
.up{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:1.5rem 1rem;border:2px dashed #444;border-radius:14px;background:var(--s2);cursor:pointer;transition:.2s;text-align:center}
.up:hover,.up.drag{border-color:var(--ac);background:rgba(0,102,255,.08)}
.up .ui{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#0066ff,#0040ff);color:#fff;font-size:1.25rem;margin-bottom:.35rem;box-shadow:0 6px 16px rgba(0,102,255,.35)}
.up b{font-size:.92rem}.up small{color:var(--t3);font-size:.76rem}
.pf label.up{margin:.2rem 0 0;color:var(--tx);font-size:inherit}.pf label.btn{margin:0;font-size:.85rem;color:var(--tx)}
.pa{display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}
.dlg-ov{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1rem;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;transition:opacity .15s}.dlg-ov.on{opacity:1}
.dlg{width:100%;max-width:400px;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:1.6rem 1.5rem 1.3rem;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);transform:translateY(8px) scale(.97);transition:transform .15s}.dlg-ov.on .dlg{transform:none}
.dlg-ic{width:54px;height:54px;margin:0 auto .9rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:rgba(0,102,255,.15);border:1px solid rgba(0,102,255,.4)}.dlg-ic.d{background:rgba(229,72,77,.14);border-color:rgba(229,72,77,.45)}
.dlg h3{font-size:1.15rem;margin-bottom:.45rem}.dlg p{color:var(--t2);font-size:.92rem;line-height:1.5;margin-bottom:1.3rem}
.dlg p code{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:.1rem .45rem;color:var(--tx);font-size:.85rem}
.dlg-bt{display:flex;gap:.6rem}.dlg-bt .btn{flex:1;padding:.7rem}
.btn.dng{background:#e5484d;border:0;color:#fff;font-weight:700}.btn.dng:hover{background:#f0575c;color:#fff;box-shadow:0 6px 18px rgba(229,72,77,.4)}

var ST={a_pagar:['A ser pago','#8b93a7'],pendente:['Pendente','#f5a524'],pago:['Pago','#22c55e'],cancelado:['Cancelado','#e5484d']};
var $=function(s){return document.querySelector(s)},fm=function(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var dt=function(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})};
var tok=sessionStorage.getItem('zox_tok')||'',orders=[],flt='todos',q='',openId={};

function rest(path,o){o=o||{};o.headers=Object.assign({apikey:CFG.supabaseKey,Authorization:'Bearer '+tok,'Content-Type':'application/json'},o.headers||{});
  return fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+path,o).then(function(r){if(r.status===401){logout();throw 0}if(!r.ok)throw r;return r})}
function showErr(e){if(!e)return;var c=e&&e.status,m=c===404?'Tabela não encontrada no Supabase. Rode o supabase-setup.sql no SQL Editor.':(c===401||c===403)?'Sem permissão ('+c+'). Confira o login e as policies do SQL.':'Falha ao falar com o Supabase'+(c?' (erro '+c+')':' (sem conexão)')+'.';var b=document.getElementById('errb');if(!b){b=document.createElement('div');b.id='errb';b.className='nt';b.style.cssText='border-color:#e5484d;color:#ffb4b6';var w=document.querySelector('.wrap')||document.getElementById('app');w.insertBefore(b,w.firstChild)}b.textContent='⚠️ '+m}
function loc(){try{return JSON.parse(localStorage.getItem('zox_orders')||'[]')}catch(e){return[]}}
function load(){
  if(!SB){orders=loc();return draw()}
  rest('orders?select=*&order=created_at.desc&limit=500').then(function(r){return r.json()}).then(function(a){orders=a;draw()}).catch(showErr)
}
function setSt(id,st){
  if(!SB){var L=loc();L.forEach(function(o){if(o.id===id)o.status=st});localStorage.setItem('zox_orders',JSON.stringify(L));return load()}
  rest('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:st})}).then(load).catch(showErr)
}
/* ===== Caixa de diálogo (substitui confirm/alert do navegador) ===== */
function dlg(o,onOk){
  var old=document.getElementById('dlg');if(old)old.remove();
  var ov=document.createElement('div');ov.id='dlg';ov.className='dlg-ov';
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlg-ic'+(o.danger?' d':'')+'">'+(o.icon||(o.danger?'🗑':'ℹ️'))+'</div><h3 id="dlgT">'+esc(o.title||'')+'</h3><p>'+(o.html||esc(o.msg||''))+'</p><div class="dlg-bt">'+(o.cancel===false?'':'<button class="btn" data-d="0">'+esc(o.cancel||'Cancelar')+'</button>')+'<button class="btn '+(o.danger?'dng':'p')+'" data-d="1">'+esc(o.ok||'OK')+'</button></div></div>';
  function fin(yes){document.removeEventListener('keydown',kd);ov.classList.remove('on');setTimeout(function(){ov.remove()},160);if(yes&&onOk)onOk()}
  function kd(e){if(e.key==='Escape')fin(0)}
  ov.addEventListener('click',function(e){if(e.target===ov)return fin(0);var b=e.target.closest('[data-d]');if(b)fin(b.dataset.d==='1')});
  document.addEventListener('keydown',kd);document.body.appendChild(ov);
  requestAnimationFrame(function(){ov.classList.add('on');var f=ov.querySelector(o.danger&&o.cancel!==false?'[data-d="0"]':'[data-d="1"]');if(f)f.focus()})
}
function del(id){
  dlg({danger:1,icon:'🗑',title:'Excluir pedido?',html:'O pedido <code>'+esc(id)+'</code> será removido definitivamente. Essa ação não pode ser desfeita.',ok:'Excluir'},function(){
    if(!SB){localStorage.setItem('zox_orders',JSON.stringify(loc().filter(function(o){return o.id!==id})));return load()}
    rest('orders?id=eq.'+encodeURIComponent(id),{method:'DELETE'}).then(load).catch(showErr)
  })
}
function logout(){tok='';sessionStorage.removeItem('zox_tok');shell()}
function login(){
  var e=$('#le').value.trim(),p=$('#lp').value;$('#lm').textContent='Entrando…';
  fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})})
   .then(function(r){return r.json()}).then(function(j){if(!j.access_token){$('#lm').textContent='E-mail ou senha incorretos.';return}tok=j.access_token;sessionStorage.setItem('zox_tok',tok);shell()})
   .catch(function(){$('#lm').textContent='Falha de conexão.'})
}
var view='o',pay={pix:{},card:{}};
function shell(){
  if(SB&&!tok){
    $('#app').innerHTML='<div class="lg"><img src="'+LOGO+'" alt="Zox Code"><h2>Painel Admin</h2><input id="le" type="email" placeholder="E-mail" autocomplete="username"><input id="lp" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn p" id="lb">Entrar</button><p id="lm"></p></div>';
    $('#lb').onclick=login;$('#lp').onkeydown=function(e){if(e.key==='Enter')login()};return
  }
  $('#app').innerHTML='<div class="top"><img src="'+LOGO+'" alt=""><b>Painel<small>Zox Code • Admin</small></b><button class="btn on" data-v="o">Pedidos</button><button class="btn" data-v="p">Pagamentos</button><button class="btn" data-v="g">Produtos</button><button class="btn" data-v="r">Avaliações</button><button class="btn" id="rf" title="Atualizar">↻</button>'+(SB?'<button class="btn" id="lo">Sair</button>':'')+'</div>'+
   '<div class="wrap">'+(SB?'':'<div class="nt">⚠️ Modo local: exibindo apenas dados deste navegador. Configure o Supabase para receber os pedidos de todos os clientes e publicar os dados de pagamento no site.</div>')+
   '<div id="vo"><div class="stats" id="st"></div><div class="bar"><div class="tabs" id="tb"></div><input class="s" id="sq" placeholder="Buscar nome, Discord, e-mail, ID…"></div><div id="ls"></div></div><div id="vp" style="display:none"></div><div id="vg" style="display:none"></div><div id="vr" style="display:none"></div></div>';
  $('#rf').onclick=function(){view==='o'?load():setView(view)};if(SB)$('#lo').onclick=logout;$('#sq').oninput=function(){q=this.value.toLowerCase();draw()};setView(view);loadRev()
}
function setView(v){
  view=v;$('#vo').style.display=v==='o'?'':'none';$('#vp').style.display=v==='p'?'':'none';$('#vg').style.display=v==='g'?'':'none';$('#vr').style.display=v==='r'?'':'none';
  document.querySelectorAll('[data-v]').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='o')load();else if(v==='r')loadRev();else if(v==='g')loadProds();else getSet(function(x){pay={pix:x.pix||{},card:x.card||{}};drawPay()})
}
/* ===== Configurações de pagamento ===== */
function getSet(cb,key){
  key=key||'payment';
  if(!SB){try{cb((JSON.parse(localStorage.getItem('zox_settings')||'{}'))[key]||{})}catch(e){cb({})}return}
  rest('settings?key=eq.'+key+'&select=value').then(function(r){return r.json()}).then(function(a){cb((a[0]&&a[0].value)||{})}).catch(function(e){showErr(e);cb({})})
}
function putSet(v,ok,fail,key){
  key=key||'payment';
  if(!SB){try{var S=JSON.parse(localStorage.getItem('zox_settings')||'{}');S[key]=v;localStorage.setItem('zox_settings',JSON.stringify(S));ok()}catch(e){fail(e)}return}
  rest('settings?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:key,value:v})}).then(ok).catch(fail)
}
/* ===== Produtos (o cliente escolhe ao avaliar) ===== */
var prods=[];
function loadProds(){getSet(function(x){prods=Array.isArray(x.list)?x.list.slice():[];drawProds()},'products')}
function drawProds(){
  $('#vg').innerHTML='<div class="nt" style="background:rgba(0,102,255,.1);border-color:rgba(0,102,255,.4)">Estes são os produtos que o cliente escolhe ao enviar a avaliação. Se a lista ficar vazia, o campo não aparece no site.</div>'+
   '<div class="pf"><h3>🛒 Produtos</h3><label>Adicionar produto</label><div style="display:flex;gap:.6rem"><input type="text" id="np" maxlength="80" placeholder="Ex.: Bot de Vendas"><button class="btn p" data-a="padd">Adicionar</button></div>'+
   '<div style="margin-top:1rem">'+(prods.length?prods.map(function(p,i){return '<div style="display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;margin-bottom:.4rem;background:var(--s2);border:1px solid var(--bd);border-radius:10px"><span style="flex:1">'+esc(p)+'</span><button class="btn no" data-a="pdel" data-id="'+i+'">Remover</button></div>'}).join(''):'<div class="em">Nenhum produto cadastrado.</div>')+'</div></div>'+
   '<button class="btn p" data-a="psave">Salvar produtos</button><span id="pg" style="margin-left:.8rem;font-size:.85rem"></span>';
  var n=$('#np');if(n)n.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();addProd()}}
}
function addProd(){var n=$('#np'),v=n?n.value.trim():'';if(!v)return;if(prods.indexOf(v)<0)prods.push(v);drawProds()}
function saveProds(){
  var n=$('#np'),v=n?n.value.trim():'';if(v&&prods.indexOf(v)<0)prods.push(v);
  $('#pg').style.color='';$('#pg').textContent='Salvando…';
  putSet({list:prods},function(){drawProds();$('#pg').style.color='#22c55e';$('#pg').textContent='Salvo ✓ — já aparece no formulário de avaliação.'},function(){$('#pg').style.color='#e5484d';$('#pg').textContent='Erro ao salvar. Rode o SQL de produtos no Supabase e confira o login.'},'products')
}
function shrink(file,cb){
  if(!file||file.type.indexOf('image/')!==0){dlg({icon:'🖼️',title:'Arquivo inválido',msg:'Escolha um arquivo de imagem (PNG ou JPG).',cancel:false,ok:'Entendi'});return}
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};
    im.onerror=function(){dlg({icon:'🖼️',title:'Imagem ilegível',msg:'Não foi possível ler essa imagem. Tente outro arquivo.',cancel:false,ok:'Entendi'})};im.src=fr.result};fr.readAsDataURL(file)
}
function readPay(){
  var v=function(i){var e=$(i);return e?e.value.trim():null};
  if(v('#fpc')!==null){pay.pix.code=v('#fpc');pay.pix.note=v('#fpn')}
  if(v('#fcl')!==null){pay.card.link=v('#fcl');pay.card.note=v('#fcn')}
}
function drawPay(){
  var P=pay.pix||{},C=pay.card||{};
  var up=function(u,id,t){var inp='<input type="file" accept="image/*" data-up="'+id+'" hidden>';
    return u?'<div class="pv"><img src="'+u+'" alt="Imagem enviada"><div class="pa"><label class="btn">'+inp+'🔄 Trocar imagem</label><button class="btn no" data-a="rmimg" data-id="'+id+'">🗑 Remover</button></div></div>'
    :'<label class="up">'+inp+'<span class="ui">⬆</span><b>Clique ou arraste a imagem aqui</b><small>'+t+' • PNG ou JPG</small></label>'};
  $('#vp').innerHTML='<div class="nt" style="background:rgba(0,102,255,.1);border-color:rgba(0,102,255,.4)">Tudo o que você preencher aparece para o cliente no checkout. Método sem nenhum dado fica oculto.</div>'+
   '<div class="pf"><h3>⚡ Pix</h3><label>Imagem do QR Code</label>'+up(P.qr,'pix','QR Code')+
   '<label>Pix Copia e Cola</label><textarea id="fpc" placeholder="Cole aqui o código Pix Copia e Cola">'+esc(P.code)+'</textarea>'+
   '<label>Observação para o cliente (opcional)</label><input type="text" id="fpn" value="'+esc(P.note)+'" placeholder="Ex.: Pix em nome de Zox Code"></div>'+
   '<div class="pf"><h3>💳 Cartão</h3><label>Link de pagamento</label><input type="text" id="fcl" value="'+esc(C.link)+'" placeholder="https://...">'+
   '<label>Imagem (opcional)</label>'+up(C.qr,'card','QR Code ou comprovante de pagamento')+
   '<label>Instruções (opcional)</label><textarea id="fcn" placeholder="Ex.: Parcelamos em até 3x. Após pagar, envie o comprovante no ticket.">'+esc(C.note)+'</textarea></div>'+
   '<button class="btn p" data-a="savepay">Salvar configurações</button><span id="pm" style="margin-left:.8rem;font-size:.85rem"></span>'
}
function savePay(){
  readPay();var l=pay.card.link||'';
  if(l&&!/^https?:\/\//i.test(l)){dlg({icon:'🔗',title:'Link inválido',msg:'O link do cartão precisa começar com http:// ou https://',cancel:false,ok:'Entendi'});return}
  var out={pix:{qr:pay.pix.qr||'',code:pay.pix.code||'',note:pay.pix.note||''},card:{link:l,qr:pay.card.qr||'',note:pay.card.note||''}};
  $('#pm').textContent='Salvando…';
  putSet(out,function(){$('#pm').style.color='#22c55e';$('#pm').textContent='Salvo ✓ — já está valendo no site.'},function(){$('#pm').style.color='#e5484d';$('#pm').textContent='Erro ao salvar. Confira o SQL do Supabase e o login.'})
}
/* ===== Avaliações (moderação) ===== */
var rv=[],rf='pendente',RS={pendente:['Pendente','#f5a524'],aprovada:['Aprovada','#22c55e'],recusada:['Recusada','#e5484d']};
function locR(){try{return JSON.parse(localStorage.getItem('zox_reviews')||'[]')}catch(e){return[]}}
function loadRev(){
  var done=function(x){rv=Array.isArray(x)?x:[];var p=rv.filter(function(r){return r.status==='pendente'}).length,b=document.querySelector('[data-v="r"]');
    if(b)b.textContent='Avaliações'+(p?' ('+p+')':'');if(view==='r')drawRev()};
  if(!SB)return done(locR());
  rest('reviews?select=*&order=created_at.desc&limit=300').then(function(r){return r.json()}).then(done).catch(showErr)
}
function setRv(id,st,tag){
  var body={status:st};if(tag!==undefined)body.tag=tag||null;
  if(!SB){var L=locR();L.forEach(function(x){if(x.id===id){x.status=st;if(tag!==undefined)x.tag=tag||null}});localStorage.setItem('zox_reviews',JSON.stringify(L));return loadRev()}
  rest('reviews?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)}).then(loadRev).catch(showErr)
}
function delRv(id){
  dlg({danger:1,icon:'🗑',title:'Excluir avaliação?',msg:'Esta avaliação será removida definitivamente. Essa ação não pode ser desfeita.',ok:'Excluir'},function(){
    if(!SB){localStorage.setItem('zox_reviews',JSON.stringify(locR().filter(function(x){return x.id!==id})));return loadRev()}
    rest('reviews?id=eq.'+encodeURIComponent(id),{method:'DELETE'}).then(loadRev).catch(showErr)
  })
}
function drawRev(){
  var cnt=function(k){return rv.filter(function(r){return k==='todas'||r.status===k}).length};
  var tabs=['pendente','aprovada','recusada','todas'].map(function(k){return '<button class="tab '+(rf===k?'on':'')+'" data-rf="'+k+'">'+(k==='todas'?'Todas':RS[k][0]+'s')+'<i>'+cnt(k)+'</i></button>'}).join('');
  var L=rv.filter(function(r){return rf==='todas'||r.status===rf});
  var btn=function(r,st,l,c){return r.status===st?'':'<button class="btn '+(c||'')+'" data-a="rvst" data-id="'+esc(r.id)+'" data-s="'+st+'">'+l+'</button>'};
  $('#vr').innerHTML='<div class="bar"><div class="tabs">'+tabs+'</div></div>'+(L.length?L.map(function(r){
    var n=Math.max(1,Math.min(5,r.rating|0)),s=RS[r.status]||RS.pendente;
    return '<div class="o on"><div class="oh" style="cursor:default"><span class="id" style="color:#f5b301;min-width:100px">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span><span class="c">'+esc(r.name)+'<small>'+dt(r.created_at)+(r.product?' • Produto: '+esc(r.product):'')+'</small></span>'+
     '<span class="pill" style="color:'+s[1]+';border-color:'+s[1]+'55;background:'+s[1]+'1a">'+s[0]+'</span></div><div class="od" style="display:block;padding-top:.9rem"><p style="line-height:1.6;white-space:pre-wrap">'+esc(r.comment)+'</p>'+
     '<div style="margin-top:.9rem"><label style="display:block;font-size:.78rem;color:var(--t2);margin-bottom:.35rem">Tag antes do nome no site (opcional)</label><input type="text" data-tg="'+esc(r.id)+'" maxlength="40" value="'+esc(r.tag)+'" placeholder="Ex.: Owner Servidor RPG" style="width:100%;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:inherit;font-size:.88rem"></div>'+'<div class="ac">'+btn(r,'aprovada','✓ Aprovar (publicar no site)','ok')+(r.status==='aprovada'?'<button class="btn" data-a="rvtag" data-id="'+esc(r.id)+'">Salvar tag</button>':'')+btn(r,'recusada','Recusar','no')+btn(r,'pendente','Voltar para pendente')+'<button class="btn no" data-a="rvdel" data-id="'+esc(r.id)+'">Excluir</button></div></div></div>'
  }).join(''):'<div class="em">Nenhuma avaliação nesta categoria.</div>')
}
function sum(st){return orders.filter(function(o){return o.status===st}).reduce(function(a,o){return a+Number(o.total||0)},0)}
function cnt(st){return orders.filter(function(o){return st==='todos'||o.status===st}).length}
function draw(){
  if(!$('#st'))return;
  $('#st').innerHTML=[['Pedidos',orders.length,'total geral','#fff'],['A ser pago',cnt('a_pagar'),fm(sum('a_pagar'))+' em aberto','#8b93a7'],['Pendentes',cnt('pendente'),fm(sum('pendente'))+' a confirmar','#f5a524'],['Pagos',cnt('pago'),fm(sum('pago'))+' recebidos','#22c55e']]
   .map(function(s){return '<div class="stat"><small>'+s[0]+'</small><h3 style="color:'+s[3]+'">'+s[1]+'</h3><span>'+s[2]+'</span></div>'}).join('');
  $('#tb').innerHTML=['todos','a_pagar','pendente','pago','cancelado'].map(function(k){return '<button class="tab '+(flt===k?'on':'')+'" data-f="'+k+'">'+(k==='todos'?'Todos':ST[k][0])+'<i>'+cnt(k)+'</i></button>'}).join('');
  var L=orders.filter(function(o){return(flt==='todos'||o.status===flt)&&(!q||[o.id,o.name,o.discord,o.email,o.server].join(' ').toLowerCase().indexOf(q)>-1)});
  $('#ls').innerHTML=L.length?L.map(card).join(''):'<div class="em">Nenhum pedido encontrado.</div>'
}
function card(o){
  var s=ST[o.status]||ST.a_pagar,its=(o.items||[]).map(function(i){return '<div class="it"><span>'+esc(i.q)+'× '+esc(i.n)+'</span><span>'+fm(i.p*i.q)+'</span></div>'}).join('');
  var btn=function(st,l,c){return o.status===st?'':'<button class="btn '+(c||'')+'" data-a="st" data-id="'+esc(o.id)+'" data-s="'+st+'">'+l+'</button>'};
  return '<div class="o '+(openId[o.id]?'on':'')+'"><div class="oh" data-a="tg" data-id="'+esc(o.id)+'"><span class="id">'+esc(o.id)+'</span><span class="c">'+esc(o.name)+'<small>'+esc(o.discord)+' • '+dt(o.created_at)+'</small></span>'+
   '<span class="v">'+fm(o.total)+'</span><span class="pill" style="color:'+s[1]+';border-color:'+s[1]+'55;background:'+s[1]+'1a">'+s[0]+'</span></div><div class="od"><div class="g">'+
   '<div><small>Cliente</small><span>'+esc(o.name)+'</span></div><div><small>Discord</small><span>'+esc(o.discord)+'</span></div><div><small>E-mail</small><span>'+esc(o.email)+'</span></div>'+
   '<div><small>Servidor</small><span>'+esc(o.server||'—')+'</span></div><div><small>Pagamento</small><span>'+(o.method==='card'?'Cartão':'Pix')+'</span></div><div><small>Mensalidade</small><span>'+(Number(o.monthly)?fm(o.monthly)+'/mês':'—')+'</span></div>'+
   '<div style="grid-column:1/-1"><small>Observações</small><span>'+esc(o.notes||'—')+'</span></div></div>'+its+
   '<div class="it" style="font-weight:700;border:0"><span>Total</span><span>'+fm(o.total)+'</span></div><div class="ac">'+btn('pago','✓ Marcar como pago','ok')+btn('pendente','Marcar pendente')+btn('a_pagar','A ser pago')+btn('cancelado','Cancelar','no')+
   '<button class="btn" data-a="cp" data-id="'+esc(o.id)+'">Copiar dados</button><button class="btn no" data-a="del" data-id="'+esc(o.id)+'">Excluir</button></div></div></div>'
}
document.addEventListener('click',function(e){
  var vb=e.target.closest('[data-v]');if(vb)return setView(vb.dataset.v);
  var rt=e.target.closest('[data-rf]');if(rt){rf=rt.dataset.rf;return drawRev()}
  var t=e.target.closest('[data-f]');if(t){flt=t.dataset.f;return draw()}
  var b=e.target.closest('[data-a]');if(!b)return;var id=b.dataset.id,a=b.dataset.a;
  if(a==='savepay')return savePay();
  if(a==='rvst'||a==='rvtag'){var ti=document.querySelector('[data-tg="'+id+'"]'),tg=ti?ti.value.trim():undefined;
    if(a==='rvtag')return setRv(id,'aprovada',tg);
    return setRv(id,b.dataset.s,b.dataset.s==='aprovada'?tg:undefined)}
  if(a==='padd')return addProd();
  if(a==='psave')return saveProds();
  if(a==='pdel'){prods.splice(+id,1);return drawProds()}
  if(a==='rvdel')return delRv(id);
  if(a==='rmimg'){readPay();pay[id].qr='';return drawPay()}
  if(a==='tg'){openId[id]=!openId[id];draw()}
  else if(a==='st')setSt(id,b.dataset.s);
  else if(a==='del')del(id);
  else if(a==='cp'){var o=orders.filter(function(x){return x.id===id})[0];if(!o)return;
    var tx='Pedido '+o.id+' ('+(ST[o.status]||ST.a_pagar)[0]+')\nCliente: '+o.name+'\nDiscord: '+o.discord+'\nE-mail: '+o.email+'\nServidor: '+(o.server||'-')+'\n'+(o.items||[]).map(function(i){return '- '+i.q+'x '+i.n}).join('\n')+'\nTotal: '+fm(o.total);
    try{navigator.clipboard.writeText(tx);b.textContent='Copiado ✓'}catch(x){}}
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.up){shrink(t.files[0],function(u){readPay();pay[t.dataset.up].qr=u;drawPay()})}});
document.addEventListener('dragover',function(e){var u=e.target.closest&&e.target.closest('.up');if(u){e.preventDefault();u.classList.add('drag')}});
document.addEventListener('dragleave',function(e){var u=e.target.closest&&e.target.closest('.up');if(u)u.classList.remove('drag')});
document.addEventListener('drop',function(e){var u=e.target.closest&&e.target.closest('.up');if(!u)return;e.preventDefault();u.classList.remove('drag');
  var i=u.querySelector('input');shrink(e.dataTransfer.files[0],function(d){readPay();pay[i.dataset.up].qr=d;drawPay()})});
setInterval(function(){if(!document.hidden&&(!SB||tok)){if(view==='o')load();loadRev()}},20000);
shell();
</script></body></html>
